version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upstox-sma-scanner
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./data/scanner.db
      - UPSTOX_CLIENT_ID=${UPSTOX_CLIENT_ID:-}
      - UPSTOX_CLIENT_SECRET=${UPSTOX_CLIENT_SECRET:-}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-default_secret_key_change_in_production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:5173}
      - DELETE_RESULTS_AFTER_SCAN=false
      - SCAN_CONCURRENCY=8
      - INCLUDE_CURRENT_DAY_CANDLE=true
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-data:
