services:
  # -----------------------------------------------------------------------------
  # SMC-NSE Institutional Terminal: Unified Web Service (Backend + React UI)
  # -----------------------------------------------------------------------------
  - type: web
    name: smc-nse-terminal
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: "production"
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./data/scanner.db"
      - key: INCLUDE_CURRENT_DAY_CANDLE
        value: "true"
      - key: DELETE_RESULTS_AFTER_SCAN
        value: "false"
